apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Firma estable: el keystore vive FUERA del repo (GitHub secret en CI,
// ~/.config/wtm/ en local). Sin la variable se usa el debug keystore normal.
def wtmKeystore = System.getenv("WTM_KEYSTORE_FILE")

android {
    namespace 'ai.ashna.wtmviewer'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.ashna.wtmviewer'
        minSdk 29
        targetSdk 34
        versionCode 5
        versionName '0.1.4-pen5'
    }

    signingConfigs {
        stable {
            if (wtmKeystore) {
                storeFile file(wtmKeystore)
                storePassword System.getenv("WTM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("WTM_KEY_ALIAS")
                keyPassword System.getenv("WTM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (wtmKeystore) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
}
