apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'ai.ashna.wtmviewer'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.ashna.wtmviewer'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '0.1.1-pen2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
}
