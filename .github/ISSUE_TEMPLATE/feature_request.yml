name: Feature request
description: Propose a capability or architecture change
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "WTM is not yet a released app. Proposals should account for Android permissions, lifecycle, security, and measurable performance."
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What concrete problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements and constraints
      description: Devices, Android versions, permissions, network, power, security, and acceptance criteria.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include passwords, ADB keys/pairing data, TLS keys, or private device identifiers.
          required: true
