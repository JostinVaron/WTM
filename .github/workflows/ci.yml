name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "aiohttp==3.14.5"

      - name: Run server security and live suites
        working-directory: runtime/termux
        run: python -m unittest tests.test_server_security tests.test_server_live -v

      - name: Compile-check Python sources
        working-directory: runtime/termux
        run: python -m py_compile server.py find-adb-port.py tests/test_server_security.py tests/test_server_live.py

      - name: Syntax-check shell scripts
        working-directory: runtime/termux
        run: |
          for f in dex.sh install.sh scrcpy-phone.sh watchdog.sh start_phone.sh \
                   update-network.sh shortcuts/start-dex.sh shortcuts/stop-dex.sh \
                   boot/01-dex.sh tests/device-smoke.sh; do
            bash -n "$f"
          done

      - name: Setup Node for client script checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check browser client scripts
        working-directory: runtime/termux
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts, self.capture, self.current = [], False, []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.capture, self.current = True, []
              def handle_endtag(self, tag):
                  if tag == "script" and self.capture:
                      self.parts.append("".join(self.current))
                      self.capture = False
              def handle_data(self, data):
                  if self.capture:
                      self.current.append(data)

          for path in sorted(Path("web").glob("*.html")):
              parser = Scripts()
              parser.feed(path.read_text())
              for script in parser.parts:
                  result = subprocess.run(
                      ["node", "--check"], input=script, text=True, capture_output=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(result.returncode)
              print(f"{path.name}: OK")
          PY

      - name: Secret sweep on changed files
        run: |
          if rg -n 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_' \
               --hidden -g '!.git' .; then
            echo "::error::Secret-like material found"
            exit 1
          fi
